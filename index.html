<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyramid Game V2</title>

<style>
:root {
  --bg: #0b1020;
  --panel: #151d31;
  --line: #2d3a56;
  --accent: #9baaff;
  --text: #f4f6fb;
  --muted: #aab5ca;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 16px;
  font-family: Arial, sans-serif;
  color: var(--text);
  background: radial-gradient(circle at top, #1b2850, var(--bg) 60%);
}

.container {
  max-width: 950px;
  margin: auto;
}

header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 28px;
}

.logo {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: linear-gradient(135deg, #9baaff, #6878d9);
  color: #11182c;
  font-size: 23px;
  font-weight: bold;
}

h1 { margin: 0; font-size: 28px; }
h2 { margin-top: 0; }

.subtitle {
  color: var(--muted);
  font-size: 13px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 15px 45px #0005;
}

p { color: var(--muted); }

label {
  display: block;
  margin: 14px 0 6px;
  color: var(--muted);
  font-size: 13px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #0e1628;
  color: white;
  font-size: 15px;
}

input:focus {
  outline: 2px solid var(--accent);
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 18px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: #11182c;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

.message {
  min-height: 24px;
  margin-top: 12px;
  font-size: 13px;
  white-space: pre-wrap;
  color: var(--muted);
}

.error { color: #ff8b9a; }
.success { color: #8be0b2; }

.hidden { display: none !important; }

.profile-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 25px;
}

.avatar {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  object-fit: cover;
  background: #26324c;
  border: 2px solid var(--line);
}

footer {
  text-align: center;
  color: #7f8ba4;
  margin-top: 30px;
  font-size: 12px;
}

@media(max-width: 700px) {
  .grid { grid-template-columns: 1fr; }
  h1 { font-size: 23px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">P</div>
  <div>
    <h1>Pyramid Game <span style="color:#9baaff">V2</span></h1>
    <div class="subtitle">Think. Vote. Climb the pyramid.</div>
  </div>
</header>

<!-- REGISTRATION AND LOGIN -->
<section id="authView" class="grid">

  <div class="panel">
    <h2>Create Account</h2>
    <p>Join Pyramid Game V2 and create your player profile.</p>

    <form id="signupForm">

      <label>Display Name</label>
      <input id="signupName"
        type="text"
        maxlength="40"
        placeholder="Your game name"
        required>

      <label>Email Address</label>
      <input id="signupEmail"
        type="email"
        placeholder="you@example.com"
        required>

      <label>Password</label>
      <input id="signupPassword"
        type="password"
        minlength="8"
        placeholder="At least 8 characters"
        required>

      <button id="signupBtn" type="submit">
        Create Account
      </button>

    </form>

    <div id="signupMessage" class="message"></div>
  </div>

  <div class="panel">
    <h2>Welcome Back</h2>
    <p>Log in using your registered account.</p>

    <form id="loginForm">

      <label>Email Address</label>
      <input id="loginEmail"
        type="email"
        placeholder="you@example.com"
        required>

      <label>Password</label>
      <input id="loginPassword"
        type="password"
        placeholder="Your password"
        required>

      <button id="loginBtn" type="submit">
        Log In
      </button>

    </form>

    <div id="loginMessage" class="message"></div>
  </div>

</section>

<!-- PLAYER PROFILE -->
<section id="profileView" class="panel hidden">

  <div class="profile-header">
    <img id="avatarPreview" class="avatar" alt="Profile picture">

    <div>
      <h2 id="welcomeName">Player</h2>
      <div id="accountEmail" class="subtitle"></div>
    </div>
  </div>

  <h2>Your Player Profile</h2>
  <p>Customize how other players see you.</p>

  <form id="profileForm">

    <label>Display Name</label>
    <input id="profileName"
      type="text"
      maxlength="40"
      required>

    <label>Profile Picture</label>
    <input id="avatarFile"
      type="file"
      accept="image/jpeg,image/png,image/webp">

    <button id="saveProfileBtn" type="submit">
      Save Profile
    </button>

  </form>

  <div id="profileMessage" class="message"></div>

  <button id="logoutBtn" type="button"
    style="background:#26324c;color:white">
    Log Out
  </button>

</section>

<footer>
  Pyramid Game V2 · Independent from Version 1
</footer>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


// ==================================
// SUPABASE CONNECTION
// ==================================

const SUPABASE_URL =
"https://tatcfimepvgyvbhvmiud.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_KfhZyLnXufBnRJSvmkqULg_02R5o4WH";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// ==================================
// VARIABLES
// ==================================

const $ = id => document.getElementById(id);

let currentUser = null;
let currentAvatarUrl = null;


// ==================================
// MESSAGE HANDLER
// ==================================

function showMessage(id, message, type = "") {
  const element = $(id);
  element.textContent = message;
  element.className = "message " + type;
}

function setBusy(button, busy, label) {
  button.disabled = busy;

  if (busy) {
    button.dataset.original = button.textContent;
    button.textContent = label;
  } else if (button.dataset.original) {
    button.textContent = button.dataset.original;
  }
}


// ==================================
// DEFAULT AVATAR
// ==================================

function defaultAvatar(name = "P") {
  const letter = (name.trim()[0] || "P").toUpperCase();

  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
      width="120" height="120">
      <rect width="100%" height="100%"
        rx="60" fill="#283654"/>
      <text x="50%" y="55%"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Arial"
        font-size="54"
        fill="#c8d0ff">${letter}</text>
    </svg>`;

  return "data:image/svg+xml," +
    encodeURIComponent(svg);
}


// ==================================
// DISPLAY AUTHENTICATION
// ==================================

function showAuth() {
  $("authView").classList.remove("hidden");
  $("profileView").classList.add("hidden");
}


// ==================================
// LOAD PLAYER PROFILE
// ==================================

async function loadProfile(user) {

  currentUser = user;

  $("authView").classList.add("hidden");
  $("profileView").classList.remove("hidden");

  $("accountEmail").textContent = user.email || "";

  const { data, error } = await supabase
    .from("profiles")
    .select("display_name, avatar_url")
    .eq("id", user.id)
    .single();

  if (error) {
    showMessage(
      "profileMessage",
      "Unable to load profile: " + error.message,
      "error"
    );
    return;
  }

  const name = data.display_name || "Player";

  currentAvatarUrl = data.avatar_url || null;

  $("welcomeName").textContent = name;
  $("profileName").value = name;

  $("avatarPreview").src =
    currentAvatarUrl || defaultAvatar(name);

  showMessage(
    "profileMessage",
    "Your account is ready.",
    "success"
  );
}


// ==================================
// PLAYER REGISTRATION
// ==================================

$("signupForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const button = $("signupBtn");

    const displayName =
      $("signupName").value.trim();

    const email =
      $("signupEmail").value.trim();

    const password =
      $("signupPassword").value;

    if (displayName.length < 2) {
      showMessage(
        "signupMessage",
        "Display name must have at least 2 characters.",
        "error"
      );
      return;
    }

    setBusy(button, true, "Creating account...");

    showMessage("signupMessage", "");

    const { data, error } =
      await supabase.auth.signUp({

        email,
        password,

        options: {
          data: {
            display_name: displayName
          }
        }

      });

    setBusy(button, false);

    if (error) {
      showMessage(
        "signupMessage",
        error.message,
        "error"
      );
      return;
    }

    if (data.session && data.user) {

      await loadProfile(data.user);

    } else {

      showMessage(
        "signupMessage",
        "Account created! Check your email for the confirmation link. Then log in.",
        "success"
      );

    }

  }
);


// ==================================
// PLAYER LOGIN
// ==================================

$("loginForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const button = $("loginBtn");

    setBusy(button, true, "Logging in...");

    showMessage("loginMessage", "");

    const { data, error } =
      await supabase.auth.signInWithPassword({

        email: $("loginEmail").value.trim(),

        password: $("loginPassword").value

      });

    setBusy(button, false);

    if (error) {

      showMessage(
        "loginMessage",
        error.message,
        "error"
      );

      return;
    }

    await loadProfile(data.user);

  }
);


// ==================================
// UPDATE PROFILE AND AVATAR
// ==================================

$("profileForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    if (!currentUser) return;

    const button = $("saveProfileBtn");

    const displayName =
      $("profileName").value.trim();

    const file =
      $("avatarFile").files[0];

    if (displayName.length < 2) {
      showMessage(
        "profileMessage",
        "Display name must have at least 2 characters.",
        "error"
      );
      return;
    }

    if (file && file.size > 2 * 1024 * 1024) {
      showMessage(
        "profileMessage",
        "Image must not exceed 2 MB.",
        "error"
      );
      return;
    }

    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];

    if (file && !allowedTypes.includes(file.type)) {
      showMessage(
        "profileMessage",
        "Use JPG, PNG, or WebP only.",
        "error"
      );
      return;
    }

    setBusy(button, true, "Saving profile...");

    showMessage("profileMessage", "");

    let avatarUrl = currentAvatarUrl;

    // UPLOAD PROFILE PICTURE
    if (file) {

      const extension =
        file.type === "image/png" ? "png" :
        file.type === "image/webp" ? "webp" : "jpg";

      const filePath =
        `${currentUser.id}/profile.${extension}`;

      const { error: uploadError } =
        await supabase.storage
          .from("avatars")
          .upload(filePath, file, {
            upsert: true,
            contentType: file.type
          });

      if (uploadError) {

        setBusy(button, false);

        showMessage(
          "profileMessage",
          "Image upload failed: " + uploadError.message,
          "error"
        );

        return;
      }

      avatarUrl =
        supabase.storage
          .from("avatars")
          .getPublicUrl(filePath)
          .data.publicUrl;

    }


    // UPDATE PROFILE DATABASE
    const { error } = await supabase
      .from("profiles")
      .update({
        display_name: displayName,
        avatar_url: avatarUrl
      })
      .eq("id", currentUser.id);

    setBusy(button, false);

    if (error) {

      showMessage(
        "profileMessage",
        "Profile update failed: " + error.message,
        "error"
      );

      return;
    }

    currentAvatarUrl = avatarUrl;

    $("welcomeName").textContent = displayName;

    $("avatarPreview").src =
      avatarUrl || defaultAvatar(displayName);

    $("avatarFile").value = "";

    showMessage(
      "profileMessage",
      "Your profile has been saved!",
      "success"
    );

  }
);


// ==================================
// LOGOUT
// ==================================

$("logoutBtn").addEventListener(
  "click",
  async () => {

    const { error } = await supabase.auth.signOut();

    if (error) {
      showMessage(
        "profileMessage",
        error.message,
        "error"
      );
      return;
    }

    currentUser = null;
    currentAvatarUrl = null;

    showAuth();

  }
);


// ==================================
// AUTHENTICATION SESSION
// ==================================

supabase.auth.onAuthStateChange(
  (event, session) => {

    if (session?.user && !currentUser) {

      setTimeout(
        () => loadProfile(session.user),
        0
      );

    } else if (!session) {

      currentUser = null;
      currentAvatarUrl = null;

      showAuth();

    }

  }
);


// ==================================
// CHECK EXISTING SESSION
// ==================================

const {
  data: { session }
} = await supabase.auth.getSession();

if (session?.user) {
  await loadProfile(session.user);
} else {
  showAuth();
}

</script>
</body>
</html>
